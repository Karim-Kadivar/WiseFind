<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Left Glyph Gradient: Electric Blue (#3B82F6) -> Violet (#7C3AED) -> Purple (#A855F7) -->
    <linearGradient id="wf-comp-blue-violet" x1="10" y1="8" x2="36" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="50%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>

    <!-- Wordmark Wise Gradient: Official Brand Gradient -->
    <linearGradient id="wf-text-wise" x1="72" y1="18" x2="135" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3B82F6" />
      <stop offset="50%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="wf-icon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Scaled Monogram Icon (54x54 box) -->
  <g transform="translate(6, 5) scale(0.54)" filter="url(#wf-icon-glow)">
    <!-- Top "F" (Brand Gradient) -->
    <path
      d="M 28 16 C 24 16, 22 18, 22 23 L 22 47 C 22 51, 24 51.5, 27 51.5 L 49 51.5 C 51 51.5, 52 50, 52 48 L 52 42 C 52 40, 51 39, 49 39 L 36 39 L 36 29 L 52 29 C 54 29, 55 27.5, 55 25.5 L 55 19.5 C 55 17.5, 54 16, 50 16 Z"
      fill="url(#wf-comp-blue-violet)"
    />
    <!-- Bottom-Left "W" Wing (Brand Gradient) -->
    <path
      d="M 22 57 C 22 55.5, 23 55, 24.5 55 L 34 55 C 35.5 55, 36 55.5, 36 57 L 36 63.5 L 48 54 C 49.5 52.8, 50 53.5, 50 55.5 L 50 71.5 C 50 73.5, 49 74, 47.5 75.2 L 34 85 C 31.5 86.8, 28 86.8, 25 84.5 C 23 83, 22 81.5, 22 78 Z"
      fill="url(#wf-comp-blue-violet)"
    />
    <!-- Right Golden Bookmark Stroke (Solid Golden Amber #FBBF24) -->
    <path
      d="M 60 16 C 58 16, 57 17.5, 57 19.5 L 57 63.5 L 50 58 C 48.5 56.8, 48 57.5, 48 59.5 L 48 71.5 C 48 73.5, 49 74.2, 50.5 75.4 L 64 85 C 66.5 86.8, 70 86.8, 73 84.5 C 75 83, 76 81.5, 76 78 L 76 23 C 76 18, 74 16, 69 16 Z"
      fill="#FBBF24"
    />
  </g>

  <!-- Complementary Brand Wordmark -->
  <!-- "Wise" in Official Electric Blue -> Violet -> Purple Gradient -->
  <text x="70" y="36" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" fill="url(#wf-text-wise)" letter-spacing="-0.5">Wise</text>
  <!-- "Find" in Solid Golden Amber #FBBF24 -->
  <text x="133" y="36" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" fill="#FBBF24" letter-spacing="-0.5">Find</text>

  <!-- Tagline -->
  <text x="71" y="49" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="7.5" fill="#64748B" letter-spacing="2" text-transform="uppercase">FIND SMARTER • CHOOSE WISELY</text>
</svg>
